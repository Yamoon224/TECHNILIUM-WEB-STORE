<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f68b1e" />
    <title>Hors connexion — Technilium</title>
    <style>
      :root { color-scheme: light dark; --bg: #ffffff; --ink: #1f2937; --soft: #6b7280; --accent: #f68b1e; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0b0f19; --ink: #f3f4f6; --soft: #9ca3af; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
      main { max-width: 26rem; }
      img { width: 72px; height: 72px; border-radius: 16px; }
      .code { margin: 16px 0 0; font-size: 3.5rem; font-weight: 700; letter-spacing: .04em; color: var(--accent); }
      h1 { margin: 4px 0 8px; font-size: 1.4rem; }
      p { margin: 0 0 20px; color: var(--soft); line-height: 1.5; }
      button { background: var(--accent); color: #fff; border: 0; border-radius: 4px; padding: 12px 22px; font-size: 1rem; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" width="72" height="72" />
      <p class="code" aria-hidden="true">Hors ligne</p>
      <h1 id="title">Vous êtes hors connexion</h1>
      <p id="text">Technilium a besoin d'internet pour afficher les produits et votre compte. Vérifiez votre connexion, puis réessayez.</p>
      <button id="retry" type="button">Réessayer</button>
    </main>
    <script>
      (function () {
        if ((navigator.language || "fr").toLowerCase().indexOf("fr") !== 0) {
          document.documentElement.lang = "en";
          document.title = "Offline — Technilium";
          document.querySelector(".code").textContent = "Offline";
          document.getElementById("title").textContent = "You are offline";
          document.getElementById("text").textContent = "Technilium needs the internet to show products and your account. Check your connection, then try again.";
          document.getElementById("retry").textContent = "Try again";
        }
        document.getElementById("retry").addEventListener("click", function () { location.reload(); });
        window.addEventListener("online", function () { location.reload(); });
      })();
    </script>
  </body>
</html>
